<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bosque Nevado</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  body { position: relative; }
  #bg {
    position: fixed; inset: 0;
    background: #000;
    transition: background 1.5s ease, opacity 1.5s ease;
    z-index: 0;
  }
  #bg.forest {
    background: url('forest.png') center/cover no-repeat;
  }
  canvas#snow {
    position: fixed; inset: 0; pointer-events: none; z-index: 2;
    opacity: 0; transition: opacity 1.5s ease;
  }
  canvas#snow.active { opacity: 1; }
  #overlay {
    position: fixed; inset: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    background: #000;
    transition: opacity 1.2s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #playBtn {
    width: 120px; height: 120px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 46px; line-height: 1;
    backdrop-filter: blur(4px);
    transition: transform .2s ease, background .2s ease, border-color .2s ease;
    box-shadow: 0 0 40px rgba(255,255,255,0.15);
  }
  #playBtn:hover {
    transform: scale(1.08);
    background: rgba(255,255,255,0.18);
    border-color: #fff;
  }
  #playBtn:active { transform: scale(0.96); }
  #hint {
    position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.5); font-size: 13px; z-index: 4;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="bg"></div>
  <canvas id="snow"></canvas>
  <div id="overlay">
    <button id="playBtn" aria-label="Play">&#9658;</button>
  </div>
  <div id="hint">Toca play para comenzar</div>

  <audio id="audio" src="song.mpeg" loop preload="auto"></audio>

<script>
  const bg = document.getElementById('bg');
  const snow = document.getElementById('snow');
  const overlay = document.getElementById('overlay');
  const playBtn = document.getElementById('playBtn');
  const audio = document.getElementById('audio');
  const ctx = snow.getContext('2d');

  let flakes = [];
  let running = false;
  let W, H;

  function resize() {
    W = snow.width = window.innerWidth;
    H = snow.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function initFlakes() {
    flakes = [];
    const count = Math.floor((W * H) / 26000);
    for (let i = 0; i < count; i++) {
      flakes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 1 + Math.random() * 3,
        vy: 0.3 + Math.random() * 0.9,
        vx: -0.3 + Math.random() * 0.6,
        drift: Math.random() * Math.PI * 2,
        driftSpeed: 0.002 + Math.random() * 0.004
      });
    }
  }

  function drawSnow() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (const f of flakes) {
      f.drift += f.driftSpeed;
      f.x += f.vx + Math.sin(f.drift) * 0.3;
      f.y += f.vy;
      if (f.y > H + 5) { f.y = -5; f.x = Math.random() * W; }
      if (f.x > W + 5) f.x = -5;
      if (f.x < -5) f.x = W + 5;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
    if (running) requestAnimationFrame(drawSnow);
  }

  async function enterFullscreen() {
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) await el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) { /* ignore */ }
  }

  // Try fullscreen on load (may be blocked until gesture)
  window.addEventListener('load', () => {
    enterFullscreen();
  });

  playBtn.addEventListener('click', async () => {
    try { await enterFullscreen(); } catch (e) { console.warn('fullscreen:', e); }
    try { await audio.play(); } catch (e) { console.error(e); }
    bg.classList.add('forest');
    snow.classList.add('active');
    running = true;
    initFlakes();
    requestAnimationFrame(drawSnow);
    overlay.classList.add('hidden');
    document.getElementById('hint').style.display = 'none';
  });

  // Pause snow when tab hidden
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) running = false; else if (snow.classList.contains('active')) { running = true; requestAnimationFrame(drawSnow); }
  });
</script>
</body>
</html>
